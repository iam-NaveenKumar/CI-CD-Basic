name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Deploy application
        shell: powershell
        run: |
          robocopy $env:GITHUB_WORKSPACE "$HOME\OneDrive\Desktop\ci-cd-deployment" /E /XD .git node_modules
          if ($LASTEXITCODE -le 7) {
              exit 0
          } else {
              exit $LASTEXITCODE
          }

      - name: Install production dependencies
        shell: powershell
        run: |
          cd "$HOME\OneDrive\Desktop\ci-cd-deployment"
          npm ci --omit=dev

      - name: Restart application
        shell: powershell
        run: |
          pm2 restart ci-cd-learning